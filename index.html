
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalEase</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        p {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 6px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #eef2f7;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>LegalEase</h1>

        <p>AI-Powered Legal Document Generator</p>

        <label>Enter Your Name</label>
        <input type="text" id="name" placeholder="Your name">

        <label>Select Document Type</label>
        <select id="type">
            <option>Rental Agreement</option>
            <option>Complaint Letter</option>
            <option>Leave Letter</option>
            <option>Request Letter</option>
        </select>

        <label>Enter Required Details</label>
        <textarea id="details" rows="5"
        placeholder="Enter your document requirements"></textarea>

        <button onclick="generateDocument()">
            Generate Document
        </button>

        <div id="result"></div>

    </div>

    <script>
        function generateDocument() {

            let name = document.getElementById("name").value;
            let type = document.getElementById("type").value;
            let details = document.getElementById("details").value;

            if (name === "" || details === "") {
                alert("Please fill all the details");
                return;
            }

            let draft =
                "LEGAL DOCUMENT DRAFT\n\n" +
                "Name: " + name + "\n" +
                "Document Type: " + type + "\n\n" +
                "Details:\n" + details + "\n\n" +
                "Generated by LegalEase.\n" +
                "Please review the draft and seek legal advice when needed.";

            document.getElementById("result").innerText = draft;
        }
    </script>

</body>
</html>
